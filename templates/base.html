<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nurbek Muxitdinov{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface2: #1a1a1a;
            --accent: #3b82f6; 
            --accent-dark: #1e40af;
            --text: #f0f0f0;
            --muted: #666;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Navigatsiya stili */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            padding: 24px 60px; background: rgba(10,10,10,0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; }
        .nav-logo span { color: var(--accent); }

        /* Animatsiyalar */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">N<span>.</span>M</div>
        <div style="display: flex; gap: 20px;">
            <a href="/" style="color: var(--muted); text-decoration: none; font-size: 14px;">Asosiy</a>
            <a href="/projects" style="color: var(--muted); text-decoration: none; font-size: 14px;">Loyihalar</a>
        </div>
        <a href="/#contact" style="background: var(--accent); color: white; padding: 8px 20px; text-decoration: none; font-size: 13px; font-weight: 600;">Aloqa</a>
    </nav>

    <main>
        {% block body %}{% endblock %}
    </main>

    <footer style="background: var(--surface); border-top: 1px solid var(--border); padding: 40px 60px; text-align: center;">
        <p style="color: var(--muted); font-size: 13px;">© 2026 Nurbek Muxitdinov. Barcha huquqlar himoyalangan.</p>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    </script>
</body>
</html>
